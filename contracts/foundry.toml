[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 1_000_000
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false

[profile.ci]
fuzz = { runs = 10000, max_test_rejects = 65536 }
invariant = { runs = 500, depth = 15, fail_on_revert = true }

[profile.benchmark]
optimizer = true
optimizer_runs = 1_000_000
via_ir = true

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"