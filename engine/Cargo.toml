[package]
name = "aegis-engine"
version = "0.1.0"
edition = "2021"
authors = ["Aegis-Kinetic Protocol Engineering"]
description = "WASM State Engine & Client Calculator for Monad Aegis-Kinetic LOB"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
sha3 = "0.10.8"
console_error_panic_hook = "0.1.7"
js-sys = "0.3.69"

[dev-dependencies]
wasm-bindgen-test = "0.3.42"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true